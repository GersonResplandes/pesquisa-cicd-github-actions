name: Pesquisa CI e entrega simulada
on:
  push:
    branches: [main]
    paths:
      - app.py
      - tests/**
      - ops.py
      - pipeline.py
      - requirements.txt
      - .github/workflows/**
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pesquisa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Testar, empacotar e simular entrega
        run: python pipeline.py run-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Preservar evidencias
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidencias-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/
            dist/
          retention-days: 14
